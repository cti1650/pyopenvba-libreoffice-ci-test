name: VBA Test with LibreOffice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-pyopenvba:
    name: Test pyOpenVBA
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pyOpenVBA tests
        run: |
          python tests/test_vba.py

      - name: Create Excel with VBA
        run: |
          python scripts/create_excel_with_vba.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: excel-files-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/
          retention-days: 7

  test-libreoffice-windows:
    name: Test VBA in LibreOffice (Windows)
    runs-on: windows-latest
    needs: test-pyopenvba

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache LibreOffice (Windows)
        id: cache-libreoffice-win
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LibreOffice
          key: libreoffice-windows-${{ runner.os }}-v1

      - name: Install LibreOffice
        if: steps.cache-libreoffice-win.outputs.cache-hit != 'true'
        run: |
          choco install libreoffice-fresh -y --no-progress
        shell: powershell

      - name: Verify LibreOffice installation
        run: |
          $soffice = "C:\Program Files\LibreOffice\program\soffice.exe"
          if (Test-Path $soffice) {
            Write-Host "LibreOffice found at: $soffice"
            & $soffice --version
          } else {
            Write-Host "LibreOffice not found at expected path"
            Get-ChildItem "C:\Program Files" -Directory | Where-Object { $_.Name -like "*Libre*" }
          }
        shell: powershell

      - name: Create Excel with VBA
        run: |
          python scripts/create_excel_with_vba.py

      - name: Run LibreOffice VBA test
        run: |
          python scripts/run_vba_libreoffice.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Convert XLSM to ODS using LibreOffice
        run: |
          $soffice = "C:\Program Files\LibreOffice\program\soffice.exe"
          if (Test-Path $soffice) {
            & $soffice --headless --convert-to ods --outdir output output\test_workbook.xlsm
            Write-Host "Conversion completed"
            Get-ChildItem output
          }
        shell: powershell
        timeout-minutes: 2
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-output-windows
          path: output/
          retention-days: 7

  test-libreoffice-ubuntu:
    name: Test VBA in LibreOffice (Ubuntu)
    runs-on: ubuntu-latest
    needs: test-pyopenvba

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libreoffice libreoffice-calc
          version: 1.1

      - name: Verify LibreOffice installation
        run: |
          which soffice
          soffice --version || echo "Version check failed, but soffice exists"

      - name: Create Excel with VBA
        run: |
          python scripts/create_excel_with_vba.py

      - name: Run LibreOffice VBA test
        run: |
          python scripts/run_vba_libreoffice.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Convert XLSM to ODS using LibreOffice
        run: |
          timeout 60 soffice --headless --convert-to ods --outdir output output/test_workbook.xlsm || true
          ls -la output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-output-ubuntu
          path: output/
          retention-days: 7

  test-class-modules:
    name: VBA class modules in LibreOffice (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test-pyopenvba
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # python3-uno is what lets the probe talk to LibreOffice over UNO.
      # Note that setup-python's interpreter has no uno; the probe finds and
      # verifies the system python3 (Linux) or LibreOffice's bundled python
      # (Windows) on its own.
      - name: Install LibreOffice (Ubuntu)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libreoffice libreoffice-calc python3-uno
          version: 1.1

      - name: Cache LibreOffice (Windows)
        if: runner.os == 'Windows'
        id: cache-libreoffice-win
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LibreOffice
          key: libreoffice-windows-${{ runner.os }}-v1

      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows' && steps.cache-libreoffice-win.outputs.cache-hit != 'true'
        run: choco install libreoffice-fresh -y --no-progress
        shell: powershell

      - name: Build class-module test workbook
        run: python scripts/create_class_test_excel.py

      - name: Probe VBA class-module support
        run: python scripts/run_class_test_libreoffice.py
        timeout-minutes: 10

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-module-results-${{ matrix.os }}
          path: |
            output/class_test_workbook.xlsm
            output/class_test_result.json
          retention-days: 7
